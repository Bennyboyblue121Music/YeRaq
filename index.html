<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YeRaq</title>

<style>
  :root {
    --bg-color: #ffffff;
    --card-bg: #f5f5f7;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --border-color: #e5e5ea;
    --accent-color: #000000;
    --card-radius: 16px;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
  }

  body.dark {
    --bg-color: #000000;
    --card-bg: #1c1c1e;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --border-color: #38383a;
    --accent-color: #ffffff;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  body.blue {
    --bg-color: #0a192f;
    --card-bg: #172a45;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #1e3a8a;
    --accent-color: #38bdf8;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
    padding: 15px 0;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg-color) 80%, transparent);
  }

  .nav {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-primary);
    text-decoration: none;
  }

  .search {
    flex: 1;
    max-width: 400px;
  }

  .search input {
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
    outline: none;
    transition: box-shadow 0.2s;
  }
  
  .search input:focus {
    box-shadow: 0 0 0 2px var(--border-color);
  }

  .nav-actions {
    display: flex;
    gap: 15px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-primary);
    cursor: pointer;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
  }

  .nav-btn:hover {
    background: var(--card-bg);
  }

  /* CAROUSEL STYLING */
  .carousel-wrapper {
    max-width: 1200px;
    margin: 40px auto 0;
    padding: 0 20px;
    position: relative;
  }

  .carousel-container {
    overflow: hidden;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    background: var(--card-bg);
    border: 1px solid var(--border-color);
  }

  .carousel-track {
    display: flex;
    transition: transform 0.5s ease-in-out;
    height: 350px;
  }

  .carousel-slide {
    min-width: 100%;
    position: relative;
    background-size: cover;
    background-position: center;
    padding: 40px;
  }

  .carousel-slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 100%);
    z-index: 1;
  }

  .carousel-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center; 
    gap: 20px;
  }

  .carousel-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin: 0;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .carousel-text {
    font-size: 1.2rem;
    margin: 0;
    color: #f5f5f7;
    line-height: 1.4;
    text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    max-width: 500px;
  }

  /* MAIN CONTENT STYLES */
  .container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
  }

  .filters {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
  }

  .filter-btn:hover {
    border-color: var(--text-secondary);
  }

  .filter-btn.active {
    background: var(--accent-color);
    color: var(--bg-color);
    border-color: var(--accent-color);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
  }

  /* RESTRUCTURED PROFILE CARDS */
  .profile-card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 15px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
    transition: transform 0.2s;
  }

  .profile-card:hover {
    transform: translateY(-5px);
  }

  .profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--border-color);
    border: 3px solid var(--border-color);
    margin-bottom: 5px;
  }

  .profile-img.fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: var(--text-secondary);
    font-weight: bold;
  }

  .profile-link-btn {
    display: inline-block;
    width: 100%;
    padding: 12px 20px;
    background: var(--accent-color);
    color: var(--bg-color);
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 12px;
    transition: opacity 0.2s;
  }

  .profile-link-btn:hover {
    opacity: 0.85;
  }

  .profile-role {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.4;
    font-weight: 500;
  }

  footer {
    margin: 60px 0 30px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  /* MODALS & OVERLAYS */
  .settings-overlay {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 200;
    min-width: 200px;
  }

  .settings-overlay.show {
    display: block;
  }

  .settings-overlay h4 {
    margin: 0 0 15px;
    font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    .nav { flex-direction: column; gap: 15px; }
    .search { max-width: 100%; }
  }
</style>
</head>

<body>
<header>
  <div class="nav">
    <a href="#" class="brand">YeRaq</a>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Search for a creator, Yeditor, or podcast..." />
    </div>
    <div class="nav-actions">
      <button class="nav-btn" id="settingsBtn">Settings</button>
      <a class="nav-btn" id="submitBtn" href="">Button</a>
    </div>
  </div>
</header>

<div class="carousel-wrapper">
  <div class="carousel-container">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-slide" style="background-image: url('https://bennyboyblue121music.github.io/Bennyboyblue121Music/Img/Other/IMG_1445-6.JPG');">
        <div class="carousel-content">
          <h2 class="carousel-title">Welcome to YeRaq</h2>
          <p class="carousel-text"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="filters" id="filterContainer">
    <button class="filter-btn active" data-filter="all">All Creators</button>
    <button class="filter-btn" data-filter="podcast">Podcasts</button>
    <button class="filter-btn" data-filter="artist">Artists</button>
    <button class="filter-btn" data-filter="yeditor">Yeditors</button>
  </div>

  <div class="grid" id="profileGrid"></div>
</div>

<div class="settings-overlay" id="settingsPanel">
  <h4>Preferences</h4>
  <button class="filter-btn" id="toggleTheme" style="width: 100%; margin-bottom: 8px;">Theme: Light</button>
</div>

<footer>© 2026 YeRaq</footer>

<script>
// --- DIRECTORY DATA --- //
// Update this array to add more people to the website.
const directoryLibrary = [
  { 
    name: "Bennyboyblue121", 
    url: "https://bennyboyblue121music.github.io/Bennyboyblue121Music/", 
    image: "Img/TuffCat.jpg", 
    type: ["podcast", "artist"],
    description: "Podcast and artist."
  },

];

// --- BUILD PROFILE GRID --- //
const grid = document.getElementById('profileGrid');

function createProfileCard(profile) {
  const card = document.createElement('div');
  card.className = 'profile-card';
  card.dataset.name = profile.name.toLowerCase();
  
  // Convert the array of types into a space-separated string for easy filtering
  card.dataset.type = profile.type.join(' ');

  // Picture handling with fallback
  let imageHTML = profile.image 
    ? `<img src="${profile.image}" alt="${profile.name}" class="profile-img" onerror="this.outerHTML='<div class=\\'profile-img fallback\\'>👤</div>'">`
    : `<div class="profile-img fallback">👤</div>`;

  card.innerHTML = `
    ${imageHTML}
    <a href="${profile.url}" target="_blank" class="profile-link-btn">${profile.name}</a>
    <p class="profile-role">${profile.description}</p>
  `;
  
  return card;
}

directoryLibrary.forEach(profile => {
  grid.appendChild(createProfileCard(profile));
});

// --- INTERACTIVITY & FILTERING --- //
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const query = searchInput.value.toLowerCase();
  document.querySelectorAll('.profile-card').forEach(card => {
    card.style.display = card.dataset.name.includes(query) ? 'flex' : 'none';
  });
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  if(btn.id === 'toggleTheme') return;

  btn.addEventListener('click', () => {
    document.querySelectorAll('#filterContainer .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const filterType = btn.dataset.filter;
    
    document.querySelectorAll('.profile-card').forEach(card => {
      const cardTypes = card.dataset.type.split(' ');
      
      let shouldShow = false;
      if (filterType === 'all') {
        shouldShow = true;
      } else if (cardTypes.includes(filterType)) {
        shouldShow = true;
      }

      // Respect the search bar if active while filtering
      const query = searchInput.value.toLowerCase();
      if (shouldShow && !card.dataset.name.includes(query)) {
        shouldShow = false;
      }

      card.style.display = shouldShow ? 'flex' : 'none';
    });
  });
});

// --- THEME LOGIC --- //
const settingsPanel = document.getElementById('settingsPanel');
document.getElementById('settingsBtn').onclick = () => settingsPanel.classList.toggle('show');

const toggleThemeBtn = document.getElementById('toggleTheme');
const themes = ['light', 'dark', 'blue'];

const applyTheme = (theme) => {
  document.body.classList.remove('dark', 'blue');
  if (theme !== 'light') {
    document.body.classList.add(theme);
  }
  toggleThemeBtn.textContent = `Theme: ${theme.charAt(0).toUpperCase() + theme.slice(1)}`;
};

let currentThemeIndex = 0;
const savedTheme = localStorage.getItem('yeraq_theme');
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

if (savedTheme && themes.includes(savedTheme)) {
  currentThemeIndex = themes.indexOf(savedTheme);
  applyTheme(savedTheme);
} else if (systemPrefersDark) {
  currentThemeIndex = 1; 
  applyTheme('dark');
} else {
  applyTheme('light');
}

toggleThemeBtn.onclick = () => {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  const nextTheme = themes[currentThemeIndex];
  applyTheme(nextTheme);
  localStorage.setItem('yeraq_theme', nextTheme);
};
</script>
</body>
</html>
