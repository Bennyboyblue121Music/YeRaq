<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YeRaq</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="nav">
      <a href="#" class="brand">YeRaq</a>
      <div class="search">
        <input id="searchInput" type="text" placeholder="Search for a creator, Yeditor, or podcast..." />
      </div>
      <div class="nav-actions">
        <a class="nav-btn highlight-btn" id="submitBtn" href="form.html"><i class="fa-solid fa-plus"></i> Add Creator</a>
        <button class="nav-btn icon-btn" id="settingsBtn" title="Settings"><i class="fa-solid fa-gear"></i></button>
      </div>
    </div>
  </header>

  <div class="carousel-wrapper">
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-slide" style="background-image: url('https://bennyboyblue121music.github.io/Bennyboyblue121Music/Img/Other/IMG_1445-6.JPG');">
          <div class="carousel-content">
            <h2 class="carousel-title">Welcome to YeRaq</h2>
            <p class="carousel-text">Discover creators, podcasts, and Yeditors.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="filters" id="filterContainer">
      <button class="filter-btn active" data-filter="all">All Creators</button>
      <button class="filter-btn" data-filter="podcast">Podcasts</button>
      <button class="filter-btn" data-filter="artist">Artists</button>
      <button class="filter-btn" data-filter="yeditor">Yeditors</button>
    </div>
    <div class="grid" id="profileGrid"></div>
  </div>

  <!-- Hidden Profile Modal -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <div class="modal-left">
        <div id="modalImageContainer"></div>
        <h2 class="modal-title" id="modalTitle">Name</h2>
        <div class="modal-tags" id="modalTags">Podcast, Artist</div>
        <p class="modal-desc" id="modalDesc">Description goes here.</p>
      </div>
      <div class="modal-right">
        <div class="social-list" id="modalSocials"></div>
        <div class="platforms-bottom" id="modalPlatforms"></div>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsPanel">
    <h4>Preferences</h4>
    <button class="filter-btn" id="toggleTheme" style="width: 100%; margin-bottom: 8px;">Theme: Light</button>
  </div>

  <footer>© 2026 YeRaq</footer>
  <script src="script.js"></script>
</body>
</html>
